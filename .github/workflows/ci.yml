name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Only keep the newest run per branch/PR; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  NEXT_TELEMETRY_DISABLED: '1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  typecheck:
    name: Typecheck (src)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reuse Next's compiler cache across runs, keyed on source + deps.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 7

  codeql:
    name: CodeQL (src)
    runs-on: ubuntu-latest
    # Overrides the workflow-level read-only default: uploading results
    # to the Security tab needs security-events: write.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # Analyze application source only; skip generated and vendored code.
          config: |
            paths:
              - src
            paths-ignore:
              - node_modules
              - .next

      # javascript-typescript is an interpreted language for CodeQL:
      # it is scanned straight from source, so no build step is needed.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # A type error should never reach a published image.
    needs: typecheck
    # Overrides the workflow-level read-only default: pushing to GHCR
    # needs packages: write.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests from forks get a read-only GITHUB_TOKEN, and an
      # unmerged PR has nothing to publish, so only log in when pushing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # On a PR the image is built to prove the Dockerfile still works,
          # then discarded; only main publishes.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layer cache across runs via the Actions cache backend.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    # Only a merged change to main gets deployed; PR builds stop at the
    # docker job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    # One host, one deployment at a time: queue runs instead of cancelling,
    # so a superseded run never kills a half-finished container swap.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    env:
      EC2_USER: ec2-user
      CONTAINER_NAME: todo-app
      HOST_PORT: '80'
      CONTAINER_PORT: '3000'
      # Deploy the exact commit that was built, not a floating tag.
      # The registry is spelled out because a job-level `env` block cannot
      # read the `env` context.
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust on first use: pins whatever key the host presents now, so a
          # later change is caught. Replace with a pinned EC2_HOST_KEY secret
          # if you need protection against a first-connection MITM.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/remote.sh <<'REMOTE'
          set -euo pipefail

          command -v docker >/dev/null 2>&1 || {
            echo "::error::docker is not installed on $(hostname)"
            exit 1
          }
          sudo systemctl is-active --quiet docker || sudo systemctl start docker

          echo "$GHCR_TOKEN" | sudo docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          sudo docker pull "$IMAGE"
          # The token is only needed for the pull; don't leave it in the
          # host's docker config.
          sudo docker logout "$REGISTRY" >/dev/null 2>&1 || true

          # Remove any previous deployment before binding the port again,
          # otherwise the new container fails to start on a port clash.
          if [ -n "$(sudo docker ps -aq -f "name=^${CONTAINER_NAME}$")" ]; then
            echo "Removing existing container ${CONTAINER_NAME}"
            sudo docker rm -f "$CONTAINER_NAME"
          fi

          sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            "$IMAGE"

          # Reclaim disk from the images this deploy superseded.
          sudo docker image prune -f >/dev/null

          # Fail the deploy if the new container never serves traffic.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${HOST_PORT}/"; then
              echo "Container ${CONTAINER_NAME} is serving on port ${HOST_PORT}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::${CONTAINER_NAME} did not become healthy within 60s"
          sudo docker logs --tail 50 "$CONTAINER_NAME" || true
          exit 1
          REMOTE

          # Prepend the values as shell assignments rather than passing them
          # as arguments, so the token never appears in the host's process list.
          {
            printf 'export GHCR_TOKEN=%q GHCR_USER=%q REGISTRY=%q IMAGE=%q CONTAINER_NAME=%q HOST_PORT=%q CONTAINER_PORT=%q\n' \
              "$GHCR_TOKEN" "$GHCR_USER" "$REGISTRY" "$IMAGE" "$CONTAINER_NAME" "$HOST_PORT" "$CONTAINER_PORT"
            cat /tmp/remote.sh
          } | ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" bash -s

      - name: Verify from the internet
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: curl -fsS -o /dev/null -w 'status=%{http_code}\n' "http://${EC2_HOST}/"
